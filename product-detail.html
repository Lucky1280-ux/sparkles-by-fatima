<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparkles By Fatima - Product Detail</title>
    <!-- Cute Bubble Font link title ke liye -->
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fcfcfc;
            color: #111;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px;
        }

        .product-wrapper {
            display: flex;
            gap: 50px;
            align-items: flex-start;
        }

        .left-side {
            width: 45%;
        }

        .right-side {
            width: 55%;
        }

        .main-img-container {
            position: relative;
            width: 450px;
            height: 450px;
            margin-bottom: 25px;
        }

        .main-img-box {
            position: relative;
            width: 100%;
            height: 100%;
            border: 2px solid #111;
            border-radius: 12px;
            overflow: hidden;
            background: white;
            z-index: 2;
        }

        .main-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .main-pink-shadow {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 100%;
            height: 100%;
            background: #ff63b1;
            border: 2px solid #111;
            border-radius: 12px;
            z-index: 1;
        }

        /* Thumbnails Gallery (Choti Images) */
        .thumbnail-row {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .thumb-container {
            position: relative;
            width: 70px;
            height: 70px;
            cursor: pointer;
        }

        .thumb-box {
            position: relative;
            width: 100%;
            height: 100%;
            border: 2px solid #111;
            border-radius: 8px;
            overflow: hidden;
            background: white;
            z-index: 2;
        }

        .thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-shadow {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 100%;
            height: 100%;
            background-color: #ff63b1;
            border: 2px solid #111;
            border-radius: 8px;
            z-index: 1;
        }

        /* Product Text Details */
        .product-title {
            font-family: 'DynaPuff', cursive; /* Banner jaisa font style */
            font-size: 26px;
            font-weight: bold;
            color: #ff63b1;
            text-shadow: -1px -1px 0 #111, 1px -1px 0 #111, -1px 1px 0 #111, 1px 1px 0 #111;
            margin: 0 0 15px 0;
            letter-spacing: 0.5px;
        }

        .product-price {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
        }

        /* Quantity Selector (- 1 +) */
        .quantity-label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }

        .quantity-wrapper {
            position: relative;
            width: 120px;
            height: 45px;
            margin-bottom: 25px;
        }

        .quantity-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid #111;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2;
        }

        .quantity-box button {
            border: none;
            background: none;
            font-size: 20px;
            font-weight: bold;
            width: 35px;
            height: 100%;
            cursor: pointer;
            outline: none;
        }

        .quantity-box span {
            font-size: 16px;
            font-weight: 600;
        }

        .qty-shadow {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 100%;
            height: 100%;
            background-color: #c7b5ff;
            border: 2px solid #111;
            z-index: 1;
        }

        /* Big Action Buttons Layout */
        .actions-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-block-wrapper {
            position: relative;
            width: 100%;
            height: 55px;
        }

        .action-btn {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid #111;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.1s ease;
        }

        .action-btn:active {
            transform: translate(4px, 4px);
        }

        .btn-add-cart {
            background-color: white;
            color: #111;
        }

        .btn-buy-now {
            background-color: #ff63b1;
            color: white;
        }

        .btn-block-shadow {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 100%;
            height: 100%;
            background-color: #111;
            z-index: 1;
        }

        /* Description Box */
        .description-section {
            margin-top: 30px;
            border-top: 1px solid #e1e1e1;
            padding-top: 20px;
        }

        .description-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .description-text {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }
        
        .back-btn {
            text-decoration: none;
            color: #555;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="product-wrapper">

        <!-- Left Side -->
        <div class="left-side">
            <a href="nails.html" class="back-btn">← Back to Products</a>

            <!-- Main Product Image -->
            <div class="main-img-container">
                <div class="main-img-box">
                    <img id="mainProductImg" src="nails1.jpeg" alt="Product Main Image">
                </div>
                <div class="main-pink-shadow"></div>
            </div>

            <!-- Thumbnails -->
            <div class="thumbnail-row">
                <div class="thumb-container" onclick="changeImage(document.getElementById('mainProductImg').src)">
                    <div class="thumb-box">
                        <img class="thumb-img-1" src="nails1.jpeg" alt="Thumb 1">
                    </div>
                    <div class="thumb-shadow"></div>
                </div>

                <div class="thumb-container" onclick="changeImage(document.getElementById('mainProductImg').src)">
                    <div class="thumb-box">
                        <img class="thumb-img-2" src="nails1.jpeg" alt="Thumb 2">
                    </div>
                    <div class="thumb-shadow"></div>
                </div>
            </div>
        </div>

        <!-- Right Side -->
        <div class="right-side">
            <!-- Product Info -->
            <h1 class="product-title">Product Name</h1>
            <div class="product-price" id="basePriceDisplay">Rs.0.00</div>

            <!-- Quantity Selector -->
            <span class="quantity-label">Quantity</span>
            <div class="quantity-wrapper">
                <div class="quantity-box">
                    <button onclick="updateQuantity(-1)">−</button>
                    <span id="qtyCount">1</span>
                    <button onclick="updateQuantity(1)">+</button>
                </div>
                <div class="qty-shadow"></div>
            </div>

            <!-- Action Buttons -->
            <div class="actions-container">
                <!-- Add To Cart Button -->
                <div class="btn-block-wrapper">
                    <button class="action-btn btn-add-cart" id="addToCartBtn" onclick="alert('Added to cart!')">Add To Cart – Rs.0.00</button>
                    <div class="btn-block-shadow"></div>
                </div>

                <!-- Buy It Now Button -->
                <div class="btn-block-wrapper">
                    <button class="action-btn btn-buy-now" onclick="redirectToCheckout()">Buy It Now</button>
                    <div class="btn-block-shadow"></div>
                </div>
            </div>

            <!-- Description Box -->
            <div class="description-section">
                <div class="description-title">Product Details ✨</div>
                <div class="description-text">
                    High-quality aesthetic products crafted just for you. Reusable, premium finish, and durable wear.
                </div>
            </div>
        </div>

    </div> <!-- Product Wrapper -->
</div> <!-- Container -->

<script>
    // 🌟 1. Link se Aaya hua Dynamic Data uthana
    const urlParams = new URLSearchParams(window.location.search);
    const imgParam = urlParams.get('img');
    const titleParam = urlParams.get('title');
    const priceParam = urlParams.get('price');

    // 💰 2. Base Price aur Quantity set karna
    let pricePerItem = priceParam ? parseFloat(priceParam) : 950;
    let currentQty = 1;

    // ✨ 3. Page load hote hi values dynamic badalna
    if (imgParam) {
        document.getElementById('mainProductImg').src = imgParam;
        document.querySelector('.thumb-img-1').src = imgParam;
        document.querySelector('.thumb-img-2').src = imgParam;
    }
    
    if (titleParam) {
        document.querySelector('.product-title').innerText = decodeURIComponent(titleParam);
    }
    
    if (priceParam) {
        document.getElementById('basePriceDisplay').innerText = 'Rs.' + pricePerItem + '.00';
        document.getElementById('addToCartBtn').textContent = `Add To Cart – Rs.${pricePerItem}.00`;
    }

    // 📸 Image badalne ka function (Thumbnails ke liye)
    function changeImage(imgSrc) {
        document.getElementById('mainProductImg').src = imgSrc;
    }

    // ➕/➖ Quantity selector ka function
    function updateQuantity(change) {
        currentQty += change;
        if (currentQty < 1) currentQty = 1; // Quantity 1 se kam na ho
        
        document.getElementById('qtyCount').textContent = currentQty;
        
        // Button ke andar price live update karna
        let totalBtnPrice = pricePerItem * currentQty;
        document.getElementById('addToCartBtn').textContent = `Add To Cart – Rs.${totalBtnPrice}.00`;
    }

    // 🛒 Checkout page par redirect karne ka function
    function redirectToCheckout() {
        window.location.href = `checkout.html?qty=${currentQty}&price=${pricePerItem}&title=${encodeURIComponent(document.querySelector('.product-title').innerText)}`;
    }
</script>



</body>
</html>
